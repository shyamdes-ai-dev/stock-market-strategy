name: daily-scan
on:
  schedule:
    - cron: "30 12 * * 1-5"      # 12:30 UTC = 18:00 IST, Mon-Fri
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-scan
  cancel-in-progress: false
defaults:
  run:
    working-directory: signals     # folder that contains cli.py
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: signals/requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore database from data branch
        working-directory: .
        run: |
          if git fetch --depth=1 origin data; then git show FETCH_HEAD:signals.db > signals/signals.db; else echo "no database yet (first run)"; fi
      - name: Scan, send Telegram report, build dashboard
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          UNIVERSE: nse,bse            # nse | bse | nse,bse
          BSE_GROUPS: A,B              # widen e.g. A,B,X,XT,T (more illiquid stocks)
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          python cli.py scan
          python cli.py export
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: signals/docs
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Save database to data branch
        working-directory: .
        run: |
          cp signals/signals.db /tmp/signals.db
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git checkout -q --orphan data-new
          git rm -rfq .
          cp /tmp/signals.db signals.db
          git add -f signals.db
          git commit -qm "database $(date -u +%F)"
          git push -f origin data-new:data
